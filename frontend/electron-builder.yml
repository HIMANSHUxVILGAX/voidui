appId: com.void.studio
productName: VOID Studio
copyright: Copyright © 2026 VOID Security
directories:
  output: dist
  buildResources: resources
npmRebuild: false

files:
  - 'out/**/*'
  - '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}'
  - '!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}'

extraResources:
  - from: '../backend/dist/void-backend'
    to: 'bin/void-backend'
    filter:
      - '**/*'

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: VOID Studio
  runAfterFinish: true

linux:
  target:
    - AppImage
    - deb
  maintainer: VOID Support <support@void.security>
  icon: resources/icon.png
  category: Security

